<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage live activity — ergoblockchain.org</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:#e5e7eb;font:14px/1.4 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  .wrap{padding:14px 16px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#fb923c;box-shadow:0 0 0 0 rgba(251,146,60,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,146,60,.7)}70%{box-shadow:0 0 0 8px rgba(251,146,60,0)}100%{box-shadow:0 0 0 0 rgba(251,146,60,0)}}
  .label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#fb923c}
  .h1{font-size:13px;color:#fff;margin-left:auto}
  .h1 a{color:#fed7aa;text-decoration:none}
  .h1 a:hover{color:#fff}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
  .row:first-of-type{border-top:none}
  .chip{font-size:9px;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(251,146,60,.4);color:#fdba74;background:rgba(251,146,60,.1);padding:2px 6px;border-radius:4px;flex-shrink:0}
  .chip.issue{border-color:rgba(245,158,11,.3);color:rgba(252,211,77,.8);background:rgba(245,158,11,.05)}
  .meta{flex:1;min-width:0}
  .tx{color:#d1d5db;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .when{color:#6b7280;font-size:10px;margin-top:1px}
  .amt{color:#fed7aa;font-size:12px;flex-shrink:0;text-align:right}
  .amt small{color:#6b7280;font-size:9px;text-transform:uppercase;margin-left:2px}
  .empty,.loading{padding:18px 0;text-align:center;color:#6b7280;font-size:11px}
  a.row{text-decoration:none;color:inherit}
  a.row:hover{background:rgba(251,146,60,.05)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="dot"></span>
    <span class="label">Live · Ergo testnet</span>
    <span class="h1"><a href="https://www.ergoblockchain.org/agent-economy#sage-activity" target="_blank">Sage on chain</a></span>
  </div>
  <div id="list" class="loading">Loading…</div>
</div>
<script>
(function(){
  var BASE = 'https://www.ergoblockchain.org';
  function nano(n){ if(!n||n<=0) return '0'; return (n/1e9).toFixed(9).replace(/\.?0+$/,''); }
  function rel(ms){ var d=Math.max(0,Date.now()-ms); var s=Math.floor(d/1000); if(s<60) return s+'s ago'; var m=Math.floor(s/60); if(m<60) return m+'m ago'; var h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }
  function escape(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function load(){
    fetch(BASE + '/api/sage/activity?limit=5').then(function(r){ return r.json(); }).then(function(d){
      var list = document.getElementById('list');
      var events = (d && d.events) || [];
      if(!events.length){ list.className='empty'; list.textContent='No activity yet — be the first to ask Sage a paid query.'; return; }
      list.className='';
      list.innerHTML = events.map(function(e){
        var isSettle = e.type === 'settlement';
        var href = isSettle ? BASE+'/r/sage/'+e.txId : 'https://testnet.ergoplatform.com/transactions/'+e.txId;
        var amt = isSettle ? (e.paymentNanoErg||0) : (e.inflowNanoErg||0);
        var chipCls = isSettle ? 'chip' : 'chip issue';
        var chipTxt = isSettle ? 'Settled' : (e.type==='issuance' ? 'Issued' : 'Transfer');
        return '<a class="row" href="'+href+'" target="_blank" rel="noopener">'+
          '<span class="'+chipCls+'">'+chipTxt+'</span>'+
          '<span class="meta"><span class="tx">'+escape(e.txId)+'</span><span class="when">block '+e.blockHeight.toLocaleString()+' · '+rel(e.timestamp)+'</span></span>'+
          '<span class="amt">'+nano(amt)+'<small>erg</small></span>'+
        '</a>';
      }).join('');
    }).catch(function(){
      var list = document.getElementById('list');
      list.className='empty'; list.textContent='Could not reach the activity feed.';
    });
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
