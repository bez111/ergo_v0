name: SRE Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-kubernetes to run this legacy Kubernetes rollout"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: ${{ github.event.inputs.confirm == 'deploy-kubernetes' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version
        id: version
        run: echo "version=$(date +%Y%m%d)-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Run tests
        run: npm test
      
      - name: Run npm security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Snyk security scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is not configured; skipping Snyk scan."
            exit 0
          fi
          npx snyk test --severity-threshold=high
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

  slo-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check current SLO status
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          if [ -z "$PROMETHEUS_URL" ]; then
            echo "PROMETHEUS_URL is required for the legacy Kubernetes rollout."
            exit 1
          fi

          ERROR_BUDGET=$(curl -s "$PROMETHEUS_URL/api/v1/query" \
            -d 'query=error_budget_remaining' | jq '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_BUDGET < 0.3" | bc -l) )); then
            echo "Error budget below 30%, blocking deployment"
            exit 1
          fi

  canary-deploy:
    runs-on: ubuntu-latest
    needs: [build, slo-check]
    environment: production-canary
    steps:
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is required for the legacy Kubernetes rollout."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > ~/.kube/config

      - name: Deploy to canary (5%)
        run: |
          kubectl set image deployment/ergo-web \
            web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }} \
            -n production-canary
          
          kubectl rollout status deployment/ergo-web -n production-canary
      
      - name: Wait and monitor canary
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          sleep 300  # 5 minutes
          
          # Check canary error rate
          ERROR_RATE=$(curl -s "$PROMETHEUS_URL/api/v1/query" \
            -d 'query=rate(http_requests_total{status=~"5..",deployment="canary"}[5m])' \
            | jq '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "Canary error rate > 1%, rolling back"
            kubectl rollout undo deployment/ergo-web -n production-canary
            exit 1
          fi

  progressive-rollout:
    runs-on: ubuntu-latest
    needs: [build, canary-deploy]
    environment: production
    strategy:
      matrix:
        percentage: [25, 50, 75, 100]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is required for the legacy Kubernetes rollout."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > ~/.kube/config

      - name: Rollout to ${{ matrix.percentage }}%
        run: |
          kubectl patch deployment ergo-web -n production \
            -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":"${{ matrix.percentage }}%"}}}}'
          
          kubectl set image deployment/ergo-web \
            web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }} \
            -n production
          
          kubectl rollout status deployment/ergo-web -n production
      
      - name: Monitor metrics
        run: |
          sleep 180  # 3 minutes per stage
          
          # Check error rate and latency
          ./scripts/check-slo.sh
          
          if [ $? -ne 0 ]; then
            echo "SLO violation detected, rolling back"
            kubectl rollout undo deployment/ergo-web -n production
            exit 1
          fi

  smoke-tests:
    runs-on: ubuntu-latest
    needs: progressive-rollout
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run smoke tests
        run: npm run smoke:routes:prod
      
      - name: Run production health check
        run: npm run health:prod

  rollback:
    runs-on: ubuntu-latest
    needs: [canary-deploy, progressive-rollout]
    if: ${{ failure() && (needs.canary-deploy.result == 'failure' || needs.progressive-rollout.result == 'failure') }}
    steps:
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is required for rollback."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > ~/.kube/config

      - name: Automatic rollback
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          kubectl rollout undo deployment/ergo-web -n production
          kubectl rollout undo deployment/ergo-web -n production-canary
          
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d '{"text":"Deployment failed and rolled back"}'
          fi
