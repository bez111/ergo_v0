app = "ergoblockchain-sage-signer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8911"
  SAGE_NETWORK = "testnet"
  SAGE_EXPECTED_WALLET_ADDRESS = "3WwRauZrYjaQYgnS9P6U4i7Ng7MBzn8MSh4yPXA9qgcySrmkEdn6"
  SAGE_MAX_SINGLE_TX_NANOERG = "10000000"
  SAGE_SIGNER_MAX_BODY_BYTES = "262144"
  SAGE_SIGNER_MAX_REQUESTS_PER_MINUTE = "30"

[http_service]
  internal_port = 8911
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

